services:
  - type: web
    name: hvac-quiz-ashrae-vscd-2026
    runtime: node
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: npm install && npm test && npm run build
    startCommand: node server/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATA_BACKEND
        value: postgres
      - key: DATABASE_URL
        sync: false
      - key: APP_ORIGIN
        value: ""
